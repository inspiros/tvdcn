name: Tests

on:
  push:
    branches: [master, stable-abi]
    tags: ['v*']
  pull_request:
    branches: [master, stable-abi]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        torch: ['2.14.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel ninja pytest
      - run: python -m pip install torch==${{ matrix.torch }} torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Build in place
        run: python setup.py build_ext --inplace
        env:
          TVDCN_BUILD_CUDA: '0'
          MAX_JOBS: '2'
      - run: python -m pytest tests --device cpu -q
      - run: python -m pytest tests/packaging -q --run-packaging
        env:
          TVDCN_BUILD_CUDA: '0'
          MAX_JOBS: '2'
